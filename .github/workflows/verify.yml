name: phase-one-verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m monkey_carousel.study
      - run: python -m monkey_carousel.v03
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: phase-one-envelopes-and-report
          path: outputs/
